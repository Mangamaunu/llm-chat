#   input        - uncached input tokens
#   output       - output tokens
#   cache_write  - tokens written to the prompt cache (5-minute TTL)
#   cache_read   - tokens read from the prompt cache
#
# Optional tier for long prompts: when a request's prompt (input + cache
# tokens) exceeds `long_context_threshold`, the prices in the model's
# `long_context` table are used instead.
#
# Models not listed here show "n/a" as their cost.
# Local models can be listed with zero prices.
# Source: Anthropic first-party API rates as of 2026-10.

